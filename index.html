<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>토끼 블로그</title>
<meta name="description" content="작은 토끼 한 마리가 안내하는 일상 기록 블로그">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/mascot.css">
</head>
<body>
<div class="info-banner">
  <div class="container info-banner__inner">
    <div class="info-banner__greeting">
      <div data-rabbit="banner"></div>
      <p id="banner-greeting"></p>
    </div>
    <div class="info-banner__stats">
      <svg class="mini-clock" viewBox="0 0 100 100" role="img" aria-label="현재 시각">
        <circle class="mini-clock__face" cx="50" cy="50" r="42"></circle>
        <line class="mini-clock__tick" x1="50" y1="10" x2="50" y2="16" transform="rotate(0 50 50)"></line>
        <line class="mini-clock__tick" x1="50" y1="10" x2="50" y2="16" transform="rotate(30 50 50)"></line>
        <line class="mini-clock__tick" x1="50" y1="10" x2="50" y2="16" transform="rotate(60 50 50)"></line>
        <line class="mini-clock__tick" x1="50" y1="10" x2="50" y2="16" transform="rotate(90 50 50)"></line>
        <line class="mini-clock__tick" x1="50" y1="10" x2="50" y2="16" transform="rotate(120 50 50)"></line>
        <line class="mini-clock__tick" x1="50" y1="10" x2="50" y2="16" transform="rotate(150 50 50)"></line>
        <line class="mini-clock__tick" x1="50" y1="10" x2="50" y2="16" transform="rotate(180 50 50)"></line>
        <line class="mini-clock__tick" x1="50" y1="10" x2="50" y2="16" transform="rotate(210 50 50)"></line>
        <line class="mini-clock__tick" x1="50" y1="10" x2="50" y2="16" transform="rotate(240 50 50)"></line>
        <line class="mini-clock__tick" x1="50" y1="10" x2="50" y2="16" transform="rotate(270 50 50)"></line>
        <line class="mini-clock__tick" x1="50" y1="10" x2="50" y2="16" transform="rotate(300 50 50)"></line>
        <line class="mini-clock__tick" x1="50" y1="10" x2="50" y2="16" transform="rotate(330 50 50)"></line>
        <line id="clock-hour" class="clock-hand clock-hand--hour" x1="50" y1="50" x2="50" y2="28" stroke-width="4"></line>
        <line id="clock-minute" class="clock-hand clock-hand--minute" x1="50" y1="50" x2="50" y2="18" stroke-width="3"></line>
        <line id="clock-second" class="clock-hand clock-hand--second" x1="50" y1="50" x2="50" y2="14" stroke-width="2"></line>
        <circle cx="50" cy="50" r="3" fill="var(--color-white)"></circle>
      </svg>
      <div class="info-banner__text">
        <span id="banner-date"></span>
        <span id="banner-time"></span>
        <span id="banner-visitors" class="banner-visitors"></span>
      </div>
    </div>
  </div>
</div>

<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-logo" href="index.html">🐇 토끼 블로그</a>
  </div>
</header>

<section class="hero container">
  <div class="hero__rabbit" data-rabbit="hero"></div>
  <h1 class="hero__title">천천히, 그러나 꾸준히</h1>
  <p class="hero__tagline">작은 토끼 한 마리가 안내하는 일상 기록 블로그입니다.</p>
</section>

<div class="scroll-hint" id="scroll-hint">
  <div data-rabbit="hint"></div>
  <span>아래로 스크롤해보세요</span>
</div>

<div class="section-divider container"><span>🐾</span></div>

<main class="content-frame container">
  <nav class="category-nav" id="category-nav" aria-label="카테고리"></nav>
  <ul class="post-list" id="post-list" aria-live="polite"></ul>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="site-footer__rabbit" data-rabbit="footer"></div>
    <p class="site-footer__note">다음에 또 만나요!</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<script type="module" src="js/home.js"></script>
</body>
</html>
